runs:
  using: "composite"
  steps:
    - name: Setup authorized_keys (Linux / macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -e
        mkdir -p "$HOME/.ssh"
        chmod 700 "$HOME/.ssh"
        f="$HOME/.ssh/authorized_keys"
        : > "$f"
        if [ -n "${{ inputs.ssh_public_key }}" ]; then
          printf '%s\n' "${{ inputs.ssh_public_key }}" >> "$f"
        fi
        if [ -n "${{ inputs.ssh_public_key_from_github }}" ]; then
          curl -fsSL "https://github.com/${{ inputs.ssh_public_key_from_github }}.keys" >> "$f"
        fi
        chmod 600 "$f"

    - name: Setup authorized_keys (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $path = "$env:PROGRAMDATA\ssh\administrators_authorized_keys"
        $keys = @()
        if ("${{ inputs.ssh_public_key }}") { $keys += "${{ inputs.ssh_public_key }}" }
        if ("${{ inputs.ssh_public_key_from_github }}") { $keys += Invoke-RestMethod "https://github.com/${{ inputs.ssh_public_key_from_github }}.keys" }
        Set-Content -Path $path -Value $keys -Encoding ascii
        icacls $path /inheritance:r
        icacls $path /grant "Administrators:F"
        icacls $path /grant "SYSTEM:F"